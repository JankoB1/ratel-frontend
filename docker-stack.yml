version: "3.9"

services:
  frontend:
    image: ratel-frontend:${IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"

        # Router
        - "traefik.http.routers.ratel-frontend.rule=Host(`pregledtrzista.rs`)"
        - "traefik.http.routers.ratel-frontend.entrypoints=websecure"
        - "traefik.http.routers.ratel-frontend.tls=true"
        - "traefik.http.routers.ratel-frontend.tls.certresolver=le"

        # HTTP → HTTPS redirect
        - "traefik.http.routers.ratel-frontend-http.rule=Host(`pregledtrzista.rs`)"
        - "traefik.http.routers.ratel-frontend-http.entrypoints=web"
        - "traefik.http.routers.ratel-frontend-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

        # Service
        - "traefik.http.services.ratel-frontend.loadbalancer.server.port=80"
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik-public:
    external: true
